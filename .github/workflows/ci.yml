name: CI

on:
  push:
    branches: [main, "etapa-*/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Valores fictícios: o build só precisa que existam (nada conecta no Supabase no CI).
      NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Testes de banco (migrações + seed + RLS no Postgres do runner)
        run: npm run test:db
      - run: npm run build
      - name: Testes de ponta a ponta (telas públicas, offline e acessibilidade)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
